# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

# Assume Python 3.8
target-version = "py311"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.


# the following settings were generated by the `pylint-to-ruff` tool
# https://github.com/akx/pylint-to-ruff?tab=readme-ov-file#readme
select = [
    "E4",
    "E7",
    "E9",
    "F",
    'W291', # trailing-whitespace
    'W292', # no-newline-at-eof
    'W293', # blank-line-at-eof
    'D100', # missing module docstring
    'D101', # missing class docstring
    'D102', # missing method docstring
    'D103', # missing function docstring
    'D417', # missing argument descriptions
    # 'D107', # undocumented __init__
    'E501', # line-too-long
    'F621', # too many args in star unpacking
    "I",    # import sorting
]

ignore = [
    "PLE1205", # logging-too-many-args
    "PLR0904", # too-many-public-methods
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR1702", # too-many-nested-blocks
    "PLW0603", # global-statement
    "PLW1514", # unspecified-encoding
    'F821',
    'E741',    # ambiguous-variable-name
    'E731',    # do-not-assign-a-lambda-expression
    'F722',    # forward-annotation-syntax-error
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# don't fix quotes
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
# unlike Black, use single quotes for strings.
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

# [isort] configuration can go here if you need to customize import sorting,

